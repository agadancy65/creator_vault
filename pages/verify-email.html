<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Provenly — creator verification and account management."
    />
    <meta name="theme-color" content="#0a1413" />
    <title>Log in — Provenly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/icons/favicon-16x16.png"
    />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/theme.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="../index.html"
          ><img
            src="../assets/icons/logo.png"
            alt=""
            width="24"
            height="24"
          />Provenly</a
        >
        <div class="topbar-actions">
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Switch to light theme"
          >
            🌙
          </button>
          <a class="text-link" href="login.html">Log in</a>
        </div>
      </header>
      <div class="page-content">
        <section class="form-section">
          <span class="eyebrow">VERIFY EMAIL</span>
          <h1>Check your email</h1>
          <p class="section-copy">
          We sent a 6-digit code to <strong id="verify-email"></strong>.
          </p>
          <form id="verify-form" class="stack-form" novalidate>
          <div class="form-error-summary" role="alert" tabindex="-1" hidden></div>
          <label>
           Verification code
           <input id="code" name="code" type="text" inputmode="numeric"
           maxlength="6" autocomplete="one-time-code" placeholder="123456" required />
          </label>
          <button class="button button-primary" type="submit">Verify</button>
          </form>
          <p class="helper-text">
          Didn't get it? <button class="inline-demo" id="resend" type="button">Resend code</button>
          <span id="resend-note"></span>
          </p>
        </section>
      </div>
    </main>
    <script src="../js/api.js"></script>
    <script src="../js/verify-email.js"></script>
    <script src="../js/navigation.js"></script>
  </body>
</html>
