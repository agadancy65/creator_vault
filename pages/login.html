<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="CreatorVault — creator verification and account management."
    />
    <meta name="theme-color" content="#0a1413" />
    <title>Log in — CreatorVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/icons/favicon-16x16.png"
    />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/theme.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="../index.html"
          ><img
            src="../assets/icons/logo.png"
            alt=""
            width="24"
            height="24"
          />CreatorVault</a
        >
        <div class="topbar-actions">
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Switch to light theme"
          >
            🌙
          </button>
          <a class="text-link" href="login.html">Log in</a>
        </div>
      </header>
      <div class="page-content">
        <section class="form-section login-section">
          <span class="eyebrow">CREATORVAULT</span>
          <h1>Welcome back.</h1>
          <p class="section-copy">
            Log in to manage your verified creator profile.
          </p>
          <div class="form-success" id="reset-success" role="status" hidden>
            <strong>Password updated.</strong> Log in with your new password.
          </div>
          <form
            class="stack-form"
            data-validate
            novalidate
            data-demo-submit="dashboard.html"
          >
            <div class="form-error-summary" role="alert" tabindex="-1"></div>
            <label>
              Email
              <input
                id="email"
                name="email"
                type="email"
                required
                autocomplete="email"
                placeholder="you@example.com"
                data-rules="required email"
              />
              <span class="field-error" id="email-error" role="alert"></span>
            </label>
            <label>
              Password
              <span class="field field--toggle">
                <input
                  id="password"
                  name="password"
                  type="password"
                  required
                  autocomplete="current-password"
                  placeholder="Your password"
                  data-rules="required password"
                />
                <button
                  type="button"
                  class="password-toggle"
                  data-toggle="password"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  Show
                </button>
              </span>
              <span class="field-error" id="password-error" role="alert"></span>
            </label>
            <button class="button button-primary" type="submit">Log in</button>
          </form>
          <p class="helper-text">
            <a class="small-link" href="forgot-password.html"
              >Forgot password?</a
            >
          </p>
          <p class="helper-text center">
            Don't have an account? <a href="signup.html">Create one</a>
          </p>
        </section>
      </div>
    </main>
    <script src="../js/form-validation.js"></script>
    <script src="../js/password-toggle.js"></script>
    <script src="../js/login.js"></script>
    <script src="../js/navigation.js"></script>
  </body>
</html>
