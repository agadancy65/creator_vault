<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="CreatorVault — creator verification and account management."
    />
    <meta name="theme-color" content="#0a1413" />
    <title>Creator dashboard — CreatorVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/icons/favicon-16x16.png"
    />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/theme.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="../index.html"
          ><img
            src="../assets/icons/logo.png"
            alt=""
            width="24"
            height="24"
          />CreatorVault</a
        >
        <div class="topbar-actions">
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Switch to light theme"
          >
            🌙
          </button>
          <a class="text-link" href="login.html">Log in</a>
        </div>
      </header>
      <div class="page-content">
        <div class="dashboard-layout">
          <div class="dashboard-main">
            <section class="dashboard-head">
              <div>
                <span
                  class="eyebrow"
                  data-creator-text="CREATOR DASHBOARD"
                  data-org-text="ORGANIZATION DASHBOARD"
                >
                  CREATOR DASHBOARD
                </span>
                <h1>Welcome back.</h1>
              </div>
              <span class="avatar">T</span>
            </section>

            <section class="dashboard-grid">
              <div class="card metric-card">
                <span class="metric-label">Verification status</span>
                <strong class="metric-value positive">Verified</strong>
              </div>
              <div class="card metric-card">
                <span class="metric-label">Linked handles</span>
                <strong class="metric-value">3</strong>
              </div>
              <div class="card metric-card">
                <span class="metric-label">Profile checks</span>
                <strong class="metric-value">128</strong>
              </div>
            </section>
          </div>

          <div class="dashboard-side">
            <section class="card handle-list-card">
              <div class="card-heading">
                <div>
                  <span
                    class="eyebrow"
                    data-creator-text="YOUR HANDLES"
                    data-org-text="YOUR BRAND HANDLES"
                  >
                    YOUR HANDLES
                  </span>
                  <h2>Verified profiles</h2>
                </div>
                <a class="small-link" href="handles.html">Edit</a>
              </div>
              <div class="handle-row">
                <span>@tobi_official</span
                ><span class="badge badge-green">Verified</span>
              </div>
              <div class="handle-row">
                <span>@tobi_music</span
                ><span class="badge badge-green">Verified</span>
              </div>
              <div class="handle-row">
                <span>@tobi_official_tv</span
                ><span class="badge badge-green">Verified</span>
              </div>
            </section>

            <a class="button button-secondary full-width" href="../index.html"
              >Back to search</a
            >
          </div>
        </div>
      </div>
    </main>
    <script src="../js/account-type.js"></script>
    <script src="../js/navigation.js"></script>
  </body>
</html>
