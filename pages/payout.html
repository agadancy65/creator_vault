<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="CreatorVault — creator verification and account management."
    />
    <meta name="theme-color" content="#0a1413" />
    <title>Payout account — CreatorVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/icons/favicon-16x16.png"
    />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/theme.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="../index.html"
          ><img
            src="../assets/icons/logo.png"
            alt=""
            width="24"
            height="24"
          />CreatorVault</a
        >
        <div class="topbar-actions">
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Switch to light theme"
          >
            🌙
          </button>
          <a class="text-link" href="login.html">Log in</a>
        </div>
      </header>
      <div class="page-content">
        <section class="form-section">
          <span class="eyebrow">STEP 3 OF 3</span>
          <h1>Add payout details</h1>
          <p
            class="section-copy"
            data-creator-text="Connect a payout account for future CreatorVault creator features."
            data-org-text="Connect a payout account for your organization's future CreatorVault features."
          >
            Connect a payout account for future CreatorVault creator features.
          </p>
          <form
            class="stack-form"
            data-validate
            novalidate
            data-demo-submit="dashboard.html"
          >
            <div class="form-error-summary" role="alert" tabindex="-1"></div>
            <label>
              Account name
              <input
                id="account-name"
                name="account-name"
                type="text"
                required
                autocomplete="name"
                placeholder="Full name"
                data-rules="required min:2"
                data-msg-min="Enter the name on the account."
              />
              <span
                class="field-error"
                id="account-name-error"
                role="alert"
              ></span>
            </label>
            <label>
              Bank name
              <input
                id="bank-name"
                name="bank-name"
                type="text"
                required
                autocomplete="organization"
                placeholder="Bank"
                data-rules="required"
              />
              <span
                class="field-error"
                id="bank-name-error"
                role="alert"
              ></span>
            </label>
            <label>
              Account number
              <input
                id="account-number"
                name="account-number"
                type="text"
                inputmode="numeric"
                required
                autocomplete="off"
                placeholder="Enter 10-digit account number"
                data-rules="required digits min:10 max:10"
                data-msg-digits="Account numbers contain digits only."
                data-msg-min="Enter the full 10-digit account number."
                data-msg-max="Account numbers are 10 digits."
              />
              <span
                class="field-error"
                id="account-number-error"
                role="alert"
              ></span>
            </label>
            <button class="button button-primary" type="submit">
              Save payout account
            </button>
          </form>
        </section>
      </div>
    </main>
    <script src="../js/form-validation.js"></script>
    <script src="../js/account-type.js"></script>
    <script src="../js/navigation.js"></script>
  </body>
</html>
