<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="CreatorVault — creator verification and account management."
    />
    <meta name="theme-color" content="#0a1413" />
    <title>Create account — CreatorVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/icons/favicon-16x16.png"
    />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/theme.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="../index.html"
          ><img
            src="../assets/icons/logo.png"
            alt=""
            width="24"
            height="24"
          />CreatorVault</a
        >
        <div class="topbar-actions">
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Switch to light theme"
          >
            🌙
          </button>
          <a class="text-link" href="login.html">Log in</a>
        </div>
      </header>
      <div class="page-content">
        <section class="form-section">
          <span class="eyebrow">CREATOR ACCOUNT</span>
          <h1>Create your account</h1>
          <p class="section-copy">
            Start the verification process and protect your audience.
          </p>
          <form
            class="stack-form"
            data-validate
            novalidate
            data-set-account-type="creator"
          >
            <div class="form-error-summary" role="alert" tabindex="-1"></div>
            <label>
              Full name
              <input id="name" name="name" type="text" required autocomplete="name"
              placeholder="Your name" data-rules="required" />
              <span class="field-error" id="name-error" role="alert"></span>
            </label>
            <label>
              Email
              <input
                id="email"
                name="email"
                type="email"
                required
                autocomplete="email"
                placeholder="you@example.com"
                data-rules="required email"
              />
              <span class="field-error" id="email-error" role="alert"></span>
            </label>
            <label>
              Password
              <span class="field field--toggle">
                <input
                  id="password"
                  name="password"
                  type="password"
                  required
                  autocomplete="new-password"
                  placeholder="Create a password"
                  data-rules="required password"
                />
                <button
                  type="button"
                  class="password-toggle"
                  data-toggle="password"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  Show
                </button>
              </span>
              <span class="field-error" id="password-error" role="alert"></span>
            </label>
            <label>
              Confirm password
              <span class="field field--toggle">
                <input
                  id="confirm-password"
                  name="confirm-password"
                  type="password"
                  required
                  autocomplete="new-password"
                  placeholder="Repeat your password"
                  data-rules="required confirm"
                  data-confirm="password"
                />
                <button
                  type="button"
                  class="password-toggle"
                  data-toggle="confirm-password"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  Show
                </button>
              </span>
              <span
                class="field-error"
                id="confirm-password-error"
                role="alert"
              ></span>
            </label>
            <button class="button button-primary" type="submit">
              Create account
            </button>
          </form>
          <p class="helper-text center">
            Already have an account? <a href="login.html">Log in</a>
          </p>
        </section>
      </div>
    </main>
    <script src="../js/form-validation.js"></script>
    <script src="../js/password-toggle.js"></script>
    <script src="../js/account-type.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/signup.js"></script>
    <script src="../js/navigation.js"></script>
  </body>
</html>
