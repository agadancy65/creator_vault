<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="CreatorVault — creator verification and account management."
    />
    <meta name="theme-color" content="#0a1413" />
    <title>Link handles — CreatorVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/icons/favicon-16x16.png"
    />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/theme.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="../index.html"
          ><img
            src="../assets/icons/logo.png"
            alt=""
            width="24"
            height="24"
          />CreatorVault</a
        >
        <div class="topbar-actions">
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Switch to light theme"
          >
            🌙
          </button>
          <a class="text-link" href="login.html">Log in</a>
        </div>
      </header>
      <div class="page-content">
        <section class="form-section">
          <span class="eyebrow">STEP 2 OF 3</span>
          <h1
            data-creator-text="Link your handles"
            data-org-text="Link brand handles"
          >
            Link your handles
          </h1>
          <p
            class="section-copy"
            data-creator-text="Add the social handles you want CreatorVault to verify."
            data-org-text="Add the brand's social handles you want CreatorVault to verify."
          >
            Add the social handles you want CreatorVault to verify.
          </p>
          <form
            class="stack-form"
            data-validate
            novalidate
            data-demo-submit="payout.html"
          >
            <div class="form-error-summary" role="alert" tabindex="-1"></div>
            <label>
              Instagram
              <input
                id="instagram"
                name="instagram"
                type="text"
                autocomplete="username"
                placeholder="@yourhandle"
                data-rules="handle"
              />
              <span
                class="field-error"
                id="instagram-error"
                role="alert"
              ></span>
            </label>
            <label>
              TikTok
              <input
                id="tiktok"
                name="tiktok"
                type="text"
                autocomplete="username"
                placeholder="@yourhandle"
                data-rules="handle"
              />
              <span class="field-error" id="tiktok-error" role="alert"></span>
            </label>
            <label>
              YouTube
              <input
                id="youtube"
                name="youtube"
                type="text"
                autocomplete="username"
                placeholder="@yourchannel"
                data-rules="handle"
              />
              <span class="field-error" id="youtube-error" role="alert"></span>
            </label>
            <button class="button button-primary" type="submit">
              Continue
            </button>
          </form>
        </section>
      </div>
    </main>
    <script src="../js/form-validation.js"></script>
    <script src="../js/account-type.js"></script>
    <script src="../js/navigation.js"></script>
  </body>
</html>
