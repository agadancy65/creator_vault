<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Provenly — choose a new password." />
    <meta name="theme-color" content="#0a1413" />
    <title>Reset password — Provenly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/icons/favicon-16x16.png"
    />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/theme.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="../index.html"
          ><img
            src="../assets/icons/logo.png"
            alt=""
            width="24"
            height="24"
          />Provenly</a
        >
        <div class="topbar-actions">
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Switch to light theme"
          >
            🌙
          </button>
          <a class="text-link" href="login.html">Log in</a>
        </div>
      </header>
      <div class="page-content">
        <section class="form-section">
          <span class="eyebrow">RESET PASSWORD</span>
          <h1>Choose a new password</h1>
          <p class="section-copy">
            Resetting the password for
            <strong class="reset-email" id="reset-email"></strong>.
          </p>

          <form id="reset-form" class="stack-form" data-validate novalidate>
            <div class="form-error-summary" role="alert" tabindex="-1"></div>
            <label>
              Reset code
              <input
                id="code"
                name="code"
                type="text"
                inputmode="numeric"
                maxlength="6"
                autocomplete="one-time-code"
                placeholder="123456"
                required
                data-rules="required"
              />
              <span class="field-error" id="code-error" role="alert"></span>
            </label>
            <label>
              New password
              <span class="field field--toggle">
                <input
                  id="password"
                  name="password"
                  type="password"
                  required
                  autocomplete="new-password"
                  placeholder="New password"
                  data-rules="required password"
                />
                <button
                  type="button"
                  class="password-toggle"
                  data-toggle="password"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  Show
                </button>
              </span>
              <span class="field-error" id="password-error" role="alert"></span>
            </label>
            <label>
              Confirm new password
              <span class="field field--toggle">
                <input
                  id="confirm-password"
                  name="confirm-password"
                  type="password"
                  required
                  autocomplete="new-password"
                  placeholder="Repeat your new password"
                  data-rules="required confirm"
                  data-confirm="password"
                />
                <button
                  type="button"
                  class="password-toggle"
                  data-toggle="confirm-password"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  Show
                </button>
              </span>
              <span
                class="field-error"
                id="confirm-password-error"
                role="alert"
              ></span>
            </label>
            <button class="button button-primary" type="submit">
              Update password
            </button>
          </form>

          <p class="helper-text center">
            Remembered it? <a href="login.html">Log in</a>
          </p>
        </section>
      </div>
    </main>
    <script src="../js/form-validation.js"></script>
    <script src="../js/password-toggle.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/reset-password.js"></script>
    <script src="../js/navigation.js"></script>
  </body>
</html>
